<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none';">
<title>UOB IT PMO</title>
<style>
  /* ===================== Design tokens ===================== */
  :root {
    --blue-900: #0a2e5c;
    --blue-800: #0e3a73;
    --blue-700: #12468c;
    --blue-600: #1a56a8;
    --blue-500: #2568c4;
    --blue-100: #e5edf8;
    --blue-50: #f2f6fc;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #d6dde6;
    --text: #16232f;
    --text-muted: #5b6b7c;
    --red: #c53030;
    --red-bg: #fbe6e6;
    --amber: #8a5a12;
    --amber-bg: #fdf1dc;
    --grey: #5a6472;
    --grey-bg: #eceff2;
    --green: #1a7a4c;
    --green-bg: #e2f5ec;
    --orange: #95400c;
    --orange-bg: #fbe8d8;
    --violet: #6b3fa0;
    --violet-bg: #ede3f7;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --radius: 8px;
    --radius-sm: 4px;
    --focus-ring: 3px solid #5b9bff;

    --shadow-card: 0 1px 2px rgba(16, 32, 48, 0.06);
    --shadow-card-hover: 0 4px 14px rgba(16, 32, 48, 0.12);
    --shadow-header: 0 2px 8px rgba(10, 20, 35, 0.18);

    --accent-text: var(--blue-800);
    --subbrand-text: rgba(255, 255, 255, 0.82);

    /* Fixed (theme-independent) solid fills for white-text badges/chips —
       deliberately NOT redefined in the dark-theme blocks below, because
       those blocks lighten --red/--green/--violet/etc. for text-on-dark-
       surface contrast, which fails WCAG when reused as a solid white-text
       fill (verified: as low as 1.62:1 contrast before this fix). */
    --badge-red: #c53030;
    --badge-orange: #b34e0f;
    --badge-amber: #9c6a1a;
    --badge-green: #1a7a4c;
    --badge-blue: #1a56a8;
    --badge-violet: #6b3fa0;

    --tag-blue-bg: var(--blue-100);
    --tag-blue-fg: var(--blue-700);

    /* Chart-only palette (validated with the dataviz skill's validate_palette.js
       against this app's actual surfaces — see CLAUDE.md "Chart palette" note).
       Kept separate from the --badge-* / column-accent tokens above: those are UI
       decoration reused across the board, these are a categorical/ordinal set
       chosen specifically to clear CVD-separation and normal-vision-floor
       checks as a 4-slot adjacent sequence. Don't hand-swap individual hues
       without re-running the validator. */
    --chart-status-1: #2a78d6;
    --chart-status-2: #eb6834;
    --chart-status-3: #1baf7a;
    --chart-status-4: #eda100;
    --chart-priority-low: #e48b8b;
    --chart-priority-medium: #d65151;
    --chart-priority-high: #b62b2b;
    --chart-priority-critical: #7c1d1d;

    color-scheme: light;
  }

  /* Dark theme tokens: applied when the user's system prefers dark and they
     haven't explicitly chosen "light", OR when they've explicitly chosen
     "dark" via the theme toggle (data-theme attribute wins either way). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --blue-900: #06101f;
      --blue-800: #0d1c33;
      --blue-700: #142a49;
      --blue-600: #1f4d8f;
      --blue-500: #4f8fe0;
      --blue-100: #182742;
      --blue-50: #121d33;
      --bg: #0a0f1a;
      --surface: #121a2b;
      --border: #263349;
      --text: #e7ecf3;
      --text-muted: #8fa0b8;
      --red: #f2867f;
      --red-bg: #3a1c1e;
      --amber: #e6b872;
      --amber-bg: #3a2c14;
      --grey: #93a2b8;
      --grey-bg: #1b2537;
      --green: #6fe0ac;
      --green-bg: #103527;
      --orange: #f0a15f;
      --orange-bg: #3d2612;
      --violet: #c4a3ea;
      --violet-bg: #2b1f42;
      --focus-ring: 3px solid #7db4ff;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, 0.5);
      --shadow-header: 0 2px 10px rgba(0, 0, 0, 0.4);
      --accent-text: #8fc0ff;
      --tag-blue-bg: #17304f;
      --tag-blue-fg: #a9cdfb;
      --chart-status-1: #3987e5;
      --chart-status-2: #d95926;
      --chart-status-3: #199e70;
      --chart-status-4: #c98500;
      --chart-priority-low: #f0ada8;
      --chart-priority-medium: #e77c74;
      --chart-priority-high: #dd473c;
      --chart-priority-critical: #b62a20;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --blue-900: #06101f;
    --blue-800: #0d1c33;
    --blue-700: #142a49;
    --blue-600: #1f4d8f;
    --blue-500: #4f8fe0;
    --blue-100: #182742;
    --blue-50: #121d33;
    --bg: #0a0f1a;
    --surface: #121a2b;
    --border: #263349;
    --text: #e7ecf3;
    --text-muted: #8fa0b8;
    --red: #f2867f;
    --red-bg: #3a1c1e;
    --amber: #e6b872;
    --amber-bg: #3a2c14;
    --grey: #93a2b8;
    --grey-bg: #1b2537;
    --green: #6fe0ac;
    --green-bg: #103527;
    --orange: #f0a15f;
    --orange-bg: #3d2612;
    --violet: #c4a3ea;
    --violet-bg: #2b1f42;
    --focus-ring: 3px solid #7db4ff;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, 0.5);
    --shadow-header: 0 2px 10px rgba(0, 0, 0, 0.4);
    --accent-text: #8fc0ff;
    --tag-blue-bg: #17304f;
    --tag-blue-fg: #a9cdfb;
    --chart-status-1: #3987e5;
    --chart-status-2: #d95926;
    --chart-status-3: #199e70;
    --chart-status-4: #c98500;
    --chart-priority-low: #f0ada8;
    --chart-priority-medium: #e77c74;
    --chart-priority-high: #dd473c;
    --chart-priority-critical: #b62a20;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  a, button, input, select, textarea, [tabindex] {
    font-family: inherit;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }

  /* ===================== Header ===================== */
  header.app-header {
    background: linear-gradient(180deg, var(--blue-900), var(--blue-800));
    color: #fff;
    padding: var(--space-4) var(--space-5);
    box-shadow: var(--shadow-header);
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--red), var(--orange), var(--amber), var(--green), var(--blue-500), var(--violet)) 1;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }

  .theme-toggle-btn {
    border: 1px solid rgba(255,255,255,0.6);
    background: transparent;
    color: #fff;
    border-radius: var(--radius-sm);
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
  }
  .theme-toggle-btn:hover { background: rgba(255,255,255,0.1); }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    flex-wrap: wrap;
  }

  .wordmark {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
  }

  .wordmark .brand {
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
  }

  .wordmark .subbrand {
    font-size: 0.85rem;
    color: var(--subbrand-text);
    font-weight: 500;
  }

  .btn {
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-4);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
  }

  .btn-primary {
    background: #fff;
    color: var(--blue-800);
  }
  .btn-primary:hover { background: var(--blue-50); }

  .btn-secondary {
    background: transparent;
    color: #fff;
    border-color: rgba(255,255,255,0.6);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-ghost:hover { background: var(--blue-50); }

  .btn-danger {
    background: var(--red);
    color: #fff;
  }
  .btn-danger:hover { background: #a52a2a; }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: inherit;
    font-size: 1rem;
    line-height: 1;
    padding: var(--space-1);
    border-radius: var(--radius-sm);
    min-width: 32px;
    min-height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: rgba(0,0,0,0.06); }

  /* Summary strip */
  .summary-strip {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    margin-top: var(--space-4);
  }

  .summary-chip {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
    font-size: 0.82rem;
    display: flex;
    gap: var(--space-1);
    align-items: baseline;
  }

  .summary-chip strong {
    font-size: 1rem;
  }

  .summary-chip.overdue {
    background: rgba(197, 48, 48, 0.35);
    border-color: rgba(197, 48, 48, 0.6);
  }

  /* ===================== Main layout ===================== */
  main {
    padding: var(--space-5);
    max-width: 1400px;
    margin: 0 auto;
  }

  .demo-note {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin: 0 0 var(--space-4);
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }

  /* Filter bar */
  .filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--space-4);
    margin-bottom: var(--space-5);
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-4);
    align-items: flex-end;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    min-width: 160px;
  }

  .filter-field label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input[type="text"],
  input[type="date"],
  select,
  textarea {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    font-size: 0.9rem;
    background: var(--surface);
    color: var(--text);
  }

  .filter-bar .btn-ghost {
    height: fit-content;
  }

  /* ===================== Board analytics ===================== */
  .analytics-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: var(--space-5);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .analytics-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: var(--space-2);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: var(--space-4);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent-text);
    text-align: left;
  }

  .analytics-toggle-caret {
    display: inline-block;
    transition: transform 0.15s ease;
    font-size: 0.8rem;
  }

  .analytics-toggle[aria-expanded="false"] .analytics-toggle-caret {
    transform: rotate(-90deg);
  }

  .analytics-toggle-hint {
    margin-left: auto;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: none;
  }

  .analytics-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-5);
    padding: 0 var(--space-4) var(--space-4);
  }

  .analytics-body[hidden] { display: none; }

  @media (max-width: 640px) {
    .analytics-body { grid-template-columns: 1fr; }
  }

  .chart-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 var(--space-3);
  }

  .chart-container svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .chart-bar-group { cursor: pointer; }
  .chart-bar-group:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
  .chart-bar-group:hover rect.chart-bar, .chart-bar-group:focus-visible rect.chart-bar { opacity: 0.82; }

  .chart-bar-value {
    font-size: 12px;
    font-weight: 700;
    fill: var(--text);
  }

  .chart-bar-label {
    font-size: 11px;
    font-weight: 600;
    fill: var(--text-muted);
  }

  .chart-baseline { stroke: var(--border); stroke-width: 1; }

  .chart-tooltip {
    position: fixed;
    z-index: 300;
    background: var(--text);
    color: var(--bg);
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
    font-size: 0.78rem;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }

  .chart-tooltip[hidden] { display: none; }

  /* ===================== Board ===================== */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-4);
  }

  @media (max-width: 768px) {
    .board {
      grid-template-columns: 1fr;
    }
  }

  .column {
    background: var(--blue-50);
    border: 1px solid var(--border);
    border-top: 4px solid var(--column-accent, var(--blue-500));
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 200px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .column[data-status="Backlog"] { --column-accent: var(--violet); }
  .column[data-status="In Progress"] { --column-accent: var(--blue-500); }
  .column[data-status="Blocked"] { --column-accent: var(--red); }
  .column[data-status="Done"] { --column-accent: var(--green); }

  .column[data-status="Backlog"] .count-badge { background: var(--badge-violet); }
  .column[data-status="In Progress"] .count-badge { background: var(--badge-blue); }
  .column[data-status="Blocked"] .count-badge { background: var(--badge-red); }
  .column[data-status="Done"] .count-badge { background: var(--badge-green); }

  .column.drag-over {
    background: var(--blue-100);
    border-color: var(--blue-500);
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent-text);
  }

  .count-badge {
    background: var(--blue-600);
    color: #fff;
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    padding: var(--space-3);
    flex: 1;
  }

  .empty-column {
    color: var(--text-muted);
    font-size: 0.82rem;
    text-align: center;
    padding: var(--space-4) var(--space-2);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 5px solid var(--grey);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    box-shadow: var(--shadow-card);
    cursor: grab;
    transition: box-shadow 0.15s ease, transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
  }
  .card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .card:active { cursor: grabbing; }

  .card.priority-critical { border-left-color: var(--red); }
  .card.priority-high { border-left-color: var(--orange); }
  .card.priority-medium { border-left-color: var(--amber); }
  .card.priority-low { border-left-color: var(--green); }

  .card-id {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 700;
    margin: var(--space-1) 0 var(--space-2);
  }

  .card-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: var(--space-2);
  }

  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    margin-bottom: var(--space-2);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
  }

  .pill-critical { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .pill-high { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
  .pill-medium { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
  .pill-low { background: var(--green-bg); color: var(--green); border-color: var(--green); }

  .tag {
    display: inline-flex;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: var(--radius-sm);
    background: var(--grey-bg);
    color: var(--text);
    border: 1px solid transparent;
  }

  /* Category tag rainbow — one hue per project category, paired with text so
     color is never the only signal (WCAG 1.4.1). Declared after the base
     .tag rule so these (equal-specificity) overrides win. */
  .tag-application-development { background: var(--tag-blue-bg); color: var(--tag-blue-fg); border-color: var(--blue-500); }
  .tag-infrastructure { background: var(--violet-bg); color: var(--violet); border-color: var(--violet); }
  .tag-cybersecurity { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .tag-data { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .tag-compliance { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
  .tag-vendor { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }

  .badge-overdue {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid var(--red);
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    margin-top: var(--space-2);
    padding-top: var(--space-2);
    border-top: 1px dashed var(--border);
  }

  .move-control {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: 0.78rem;
  }

  .move-control select {
    font-size: 0.78rem;
    padding: 2px 6px;
  }

  .delete-confirm {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: 0.78rem;
    background: var(--red-bg);
    border: 1px solid var(--red);
    border-radius: var(--radius-sm);
    padding: var(--space-1) var(--space-2);
  }

  .delete-confirm button {
    font-size: 0.75rem;
    padding: 2px 8px;
  }

  /* ===================== Modal ===================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 35, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-6) var(--space-4);
    overflow-y: auto;
    z-index: 100;
  }

  .modal-overlay[hidden] { display: none; }

  .modal {
    background: var(--surface);

</style>
</head>
<body>

<script>
/* =========================================================================
   CONFIG
   FormSubmit requires a one-time activation: the FIRST submission ever sent
   to this address triggers a confirmation email from FormSubmit. Until the
   link in that confirmation email is clicked, no notifications are actually
   delivered (the AJAX call itself still succeeds from the browser's point
   of view). Swap the email in this single constant to redirect notifications.
   ========================================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/ianleonardo@gmail.com";

/* =========================================================================
   THEME (light/dark)
   Scoped exception to the "no persistence" rule below: this single key only
   ever stores the UI theme choice, never board/task data, which still lives
   only in the in-memory `state` object and resets on refresh.
   ========================================================================= */
const THEME_STORAGE_KEY = "uobItpmTheme";

/* =========================================================================
   STATE — single source of truth. All rendering reads from this object;
   nothing else mutates the DOM's card content directly.
   ========================================================================= */
const COLUMNS = ["Backlog", "In Progress", "Blocked", "Done"];
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];

const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextIdNum: 1,
  deleteConfirmingId: null, // id of the card currently showing its inline Delete? Yes/No toggle
};

/* =========================================================================
   SEED DATA
   ========================================================================= */
function todayPlus(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function seedTasks() {
  const seeds = [
    {
      title: "Migrate FX pricing service to AWS",
      description: "Lift-and-shift the FX pricing microservice from on-prem VMs to AWS ECS, including connectivity to the core banking gateway.",
      project: "Infrastructure & Cloud", category: "Infrastructure",
      assignee: "Rachel Tan", priority: "High", dueDate: todayPlus(14), status: "In Progress",
    },
    {
      title: "Patch CVE-2025-XXXX on branch teller VDI",
      description: "Apply vendor-supplied security patch to all branch teller virtual desktop images and validate with a pilot branch.",
      project: "Cybersecurity Uplift", category: "Cybersecurity",
      assignee: "Marcus Lim", priority: "Critical", dueDate: todayPlus(-2), status: "Blocked",
    },
    {
      title: "UAT sign-off for mobile onboarding release 4.2",
      description: "Coordinate business UAT sessions and collect sign-off from Digital Channels stakeholders before go-live.",
      project: "Digital Channels", category: "Application Development",
      assignee: "Priya Nair", priority: "High", dueDate: todayPlus(5), status: "In Progress",
    },
    {
      title: "Vendor SLA review — core switching platform",
      description: "Annual review of vendor SLA terms and penalty clauses ahead of contract renewal.",
      project: "Vendor Management", category: "Vendor",
      assignee: "David Ong", priority: "Medium", dueDate: todayPlus(21), status: "Backlog",
    },
    {
      title: "Build data lineage dashboard for regulatory reporting",
      description: "Design and build a Power BI-style lineage dashboard tracing fields used in MAS regulatory submissions.",
      project: "Data & Analytics", category: "Data",
      assignee: "Serena Goh", priority: "Medium", dueDate: todayPlus(30), status: "Backlog",
    },
    {
      title: "Decommission legacy loan origination server",
      description: "Retire the on-prem loan origination application server following successful cutover to the new platform.",
      project: "Core Banking Upgrade", category: "Infrastructure",
      assignee: "Marcus Lim", priority: "Low", dueDate: todayPlus(-10), status: "Done",
    },
    {
      title: "Conduct phishing simulation — Q3 staff campaign",
      description: "Run a quarterly phishing simulation across all staff and compile the awareness training follow-up list.",
      project: "Cybersecurity Uplift", category: "Cybersecurity",
      assignee: "Aisyah Rahman", priority: "Medium", dueDate: todayPlus(-1), status: "In Progress",
    },
    {
      title: "Complete PCI-DSS compliance checklist for card platform",
      description: "Work with Compliance to close out the remaining PCI-DSS control gaps identified in the last audit.",
      project: "Core Banking Upgrade", category: "Compliance",
      assignee: "David Ong", priority: "Critical", dueDate: todayPlus(60), status: "Done",
    },
  ];

  seeds.forEach((s) => {
    state.tasks.push({ id: nextTaskId(), ...s });
  });
}

function nextTaskId() {
  const id = "UOB-ITPM-" + String(state.nextIdNum).padStart(4, "0");
  state.nextIdNum += 1;
  return id;
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < new Date().toISOString().slice(0, 10);
}

function priorityClass(priority) {
  return "priority-" + priority.toLowerCase();
}

function categoryTagClass(category) {
  return "tag-" + category.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function isValidIsoDate(str) {
  return /^\d{4}-\d{2}-\d{2}$/.test(str) && !isNaN(new Date(str + "T00:00:00").getTime());
}

function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

/* =========================================================================
   FILTERING
   ========================================================================= */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  return tasks.filter((t) => {
    if (project && t.project !== project) return false;
    if (priority && t.priority !== priority) return false;
    if (assignee && !t.assignee.toLowerCase().includes(assignee.toLowerCase())) return false;
    return true;
  });
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function renderBoard() {
  const board = document.getElementById("board");
  const visibleTasks = applyFilters(state.tasks);

  board.innerHTML = COLUMNS.map((colName) => {
    const colTasks = visibleTasks.filter((t) => t.status === colName);
    const cardsHtml = colTasks.length
      ? colTasks.map(renderCard).join("")
      : '<p class="empty-column">No tasks</p>';

    return `
      <div class="column" data-status="${escapeHtml(colName)}">
        <div class="column-header">
          <span>${escapeHtml(colName)}</span>
          <span class="count-badge">${colTasks.length}</span>
        </div>
        <div class="card-list" data-status="${escapeHtml(colName)}">
          ${cardsHtml}
        </div>
      </div>
    `;
  }).join("");

  attachDragAndDropHandlers();
  renderSummary();
  renderAnalytics();
}

function renderCard(task) {
  const overdue = isOverdue(task);
  const confirming = state.deleteConfirmingId === task.id;

  const moveOptions = COLUMNS.map(
    (c) => `<option value="${escapeHtml(c)}" ${c === task.status ? "selected" : ""}>${escapeHtml(c)}</option>`
  ).join("");

  const footer = confirming
    ? `
      <div class="delete-confirm" role="group" aria-label="Confirm delete task ${escapeHtml(task.id)}">
        <span>Delete?</span>
        <button type="button" class="btn btn-danger" data-action="confirm-delete" data-id="${escapeHtml(task.id)}">Yes</button>
        <button type="button" class="btn btn-ghost" data-action="cancel-delete" data-id="${escapeHtml(task.id)}">No</button>
      </div>
    `
    : `
      <div class="move-control">
        <label for="move-${escapeHtml(task.id)}">Move ▸</label>
        <select id="move-${escapeHtml(task.id)}" data-action="move" data-id="${escapeHtml(task.id)}" aria-label="Move task ${escapeHtml(task.id)} to a different column">
          ${moveOptions}
        </select>
      </div>
      <button type="button" class="icon-btn" data-action="start-delete" data-id="${escapeHtml(task.id)}" aria-label="Delete task ${escapeHtml(task.id)}">✕</button>
    `;

  return `
    <article class="card ${priorityClass(task.priority)}" draggable="true" data-id="${escapeHtml(task.id)}" aria-label="${escapeHtml(task.title)}">
      <div class="card-id">${escapeHtml(task.id)}</div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      <div class="card-meta">
        <span>${escapeHtml(task.project)}</span>
        <span>Assignee: ${escapeHtml(task.assignee)}</span>
        <span>Due: ${escapeHtml(formatDate(task.dueDate))}</span>
      </div>
      <div class="card-badges">
        <span class="pill pill-${task.priority.toLowerCase()}">${escapeHtml(task.priority)}</span>
        <span class="tag ${categoryTagClass(task.category)}">${escapeHtml(task.category)}</span>
        ${overdue ? '<span class="badge-overdue">⚠ Overdue</span>' : ""}
      </div>
      <div class="card-footer">
        ${footer}
      </div>
    </article>
  `;
}

function renderSummary() {
  const strip = document.getElementById("summaryStrip");
  const total = state.tasks.length;
  const overdueCount = state.tasks.filter(isOverdue).length;

  const statusChips = COLUMNS.map((c) => {
    const count = state.tasks.filter((t) => t.status === c).length;
    return `<span class="summary-chip"><strong>${count}</strong> ${escapeHtml(c)}</span>`;
  }).join("");

  strip.innerHTML = `
    <span class="summary-chip"><strong>${total}</strong> Total tasks</span>
    ${statusChips}
    <span class="summary-chip overdue"><strong>${overdueCount}</strong> Overdue</span>
  `;
}

/* =========================================================================
   BOARD ANALYTICS (bar charts, unfiltered — reflects the whole board)
   ========================================================================= */
const STATUS_CHART_COLORS = {
  Backlog: "var(--chart-status-1)",
  "In Progress": "var(--chart-status-2)",
  Blocked: "var(--chart-status-3)",
  Done: "var(--chart-status-4)",
};

const PRIORITY_ORDER = ["Low", "Medium", "High", "Critical"];
const PRIORITY_CHART_COLORS = {
  Low: "var(--chart-priority-low)",
  Medium: "var(--chart-priority-medium)",
  High: "var(--chart-priority-high)",
  Critical: "var(--chart-priority-critical)",
};

function roundedTopBarPath(x, yTop, width, height, radius) {
  if (height <= 0) return "";
  const r = Math.min(radius, height, width / 2);
  const yBase = yTop + height;
  return [
    `M ${x} ${yTop + r}`,
    `Q ${x} ${yTop} ${x + r} ${yTop}`,
    `L ${x + width - r} ${yTop}`,
    `Q ${x + width} ${yTop} ${x + width} ${yTop + r}`,
    `L ${x + width} ${yBase}`,
    `L ${x} ${yBase}`,
    "Z",
  ].join(" ");
}

function buildBarChartSvg(data) {
  const vw = 300;
  const vh = 170;
  const topPad = 22;
  const bottomPad = 30;
  const baseline = vh - bottomPad;
  const barWidth = 24;
  const maxValue = Math.max(1, ...data.map((d) => d.value));
  const slot = vw / data.length;

  const bars = data
    .map((d, i) => {
      const x = slot * i + slot / 2 - barWidth / 2;
      const barHeight = d.value === 0 ? 0 : (d.value / maxValue) * (baseline - topPad);
      const yTop = baseline - barHeight;
      const path = roundedTopBarPath(x, yTop, barWidth, barHeight, 4);
      const safeLabel = escapeHtml(d.label);
      const valueY = Math.max(12, yTop - 6);
      const mark = path
        ? `<path class="chart-bar" d="${path}" style="fill:${d.colorVar}"></path>`
        : `<line x1="${x}" y1="${baseline}" x2="${x + barWidth}" y2="${baseline}" style="stroke:${d.colorVar}" stroke-width="3" stroke-linecap="round"></line>`;

      return `
        <g class="chart-bar-group" tabindex="0" data-label="${safeLabel}" data-value="${d.value}"
           aria-label="${safeLabel}: ${d.value} task${d.value === 1 ? "" : "s"}">
          ${mark}
          <text class="chart-bar-value" x="${x + barWidth / 2}" y="${valueY}" text-anchor="middle">${d.value}</text>
        </g>
        <text class="chart-bar-label" x="${x + barWidth / 2}" y="${baseline + 18}" text-anchor="middle">${safeLabel}</text>
      `;
    })
    .join("");

  return `
    <svg viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="xMidYMid meet">
      <line class="chart-baseline" x1="0" y1="${baseline}" x2="${vw}" y2="${baseline}"></line>
      ${bars}
    </svg>
  `;
}

function attachChartInteractions(container) {
  const tooltip = document.getElementById("chartTooltip");

  container.querySelectorAll(".chart-bar-group").forEach((group) => {
    const showTooltip = () => {
      const rect = group.getBoundingClientRect();
      const label = group.dataset.label;
      const value = group.dataset.value;
      tooltip.textContent = `${label}: ${value} task${value === "1" ? "" : "s"}`;
      tooltip.hidden = false;
      tooltip.style.left = rect.left + rect.width / 2 + "px";
      tooltip.style.top = rect.top - 8 + "px";
      tooltip.style.transform = "translate(-50%, -100%)";
    };
    const hideTooltip = () => {
      tooltip.hidden = true;
    };

    group.addEventListener("pointerenter", showTooltip);
    group.addEventListener("pointermove", showTooltip);
    group.addEventListener("pointerleave", hideTooltip);
    group.addEventListener("focus", showTooltip);
    group.addEventListener("blur", hideTooltip);
  });
}

function renderAnalytics() {
  const statusData = COLUMNS.map((c) => ({
    label: c,
    value: state.tasks.filter((t) => t.status === c).length,
    colorVar: STATUS_CHART_COLORS[c],
  }));

  const priorityData = PRIORITY_ORDER.map((p) => ({
    label: p,
    value: state.tasks.filter((t) => t.priority === p).length,
    colorVar: PRIORITY_CHART_COLORS[p],
  }));

  const statusEl = document.getElementById("chartStatus");
  const priorityEl = document.getElementById("chartPriority");
  statusEl.innerHTML = buildBarChartSvg(statusData);
  priorityEl.innerHTML = buildBarChartSvg(priorityData);
  attachChartInteractions(statusEl);
  attachChartInteractions(priorityEl);
}

function attachAnalyticsToggle() {
  const btn = document.getElementById("analyticsToggleBtn");
  const body = document.getElementById("analyticsBody");
  btn.addEventListener("click", () => {
    const expanded = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", String(!expanded));
    body.hidden = expanded;
  });
}

function renderProjectFilterOptions() {
  const select = document.getElementById("filterProject");
  const current = select.value;
  select.innerHTML =
    '<option value="">All projects</option>' +
    PROJECTS.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
  select.value = current;
}

/* =========================================================================
   TASK MUTATIONS
   ========================================================================= */
function moveTask(taskId, newStatus) {
  const task = state.tasks.find((t) => t.id === taskId);
  if (!task || !COLUMNS.includes(newStatus)) return;
  task.status = newStatus;
  renderBoard();
}

function deleteTask(taskId) {
  state.tasks = state.tasks.filter((t) => t.id !== taskId);
  if (state.deleteConfirmingId === taskId) state.deleteConfirmingId = null;
  renderBoard();
}

async function addTask(formValues) {
  const task = {
    id: nextTaskId(),
    title: formValues.title.trim(),
    description: formValues.description.trim(),
    project: formValues.project,
    category: formValues.category,
    assignee: formValues.assignee.trim(),
    priority: formValues.priority,
    dueDate: formValues.dueDate,
    status: formValues.status,
  };

  // Optimistic UI: add + render immediately.
  state.tasks.push(task);
  renderBoard();
  showToast(`Task ${task.id} added.`, "success");

  // Fire the email notification in parallel; never let it break the board.
  notifyNewTask(task);
}

/* =========================================================================
   FORMSUBMIT NOTIFICATION
   ========================================================================= */
async function notifyNewTask(task) {
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  } catch (err) {
    showToast("Card added locally — email notification failed.", "warning");
  }
}

/* =========================================================================
   TOASTS
   ========================================================================= */
function showToast(message, type) {
  const region = document.getElementById("toastRegion");
  const toast = document.createElement("div");
  toast.className = `toast toast-${type || "success"}`;
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => {
    toast.remove();
  }, 4000);
}

/* =========================================================================
   DRAG AND DROP
   ========================================================================= */
let draggedTaskId = null;

function attachDragAndDropHandlers() {
  document.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("dragstart", (e) => {
      draggedTaskId = card.dataset.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", card.dataset.id);
    });
  });

  document.querySelectorAll(".column").forEach((column) => {
    column.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      column.classList.add("drag-over");
    });

    column.addEventListener("dragleave", (e) => {
      if (!column.contains(e.relatedTarget)) {
        column.classList.remove("drag-over");
      }
    });

    column.addEventListener("drop", (e) => {
      e.preventDefault();
      column.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain") || draggedTaskId;
      const newStatus = column.dataset.status;
      if (id && newStatus) moveTask(id, newStatus);
      draggedTaskId = null;
    });
  });
}

/* =========================================================================
   BOARD EVENT DELEGATION (move select, delete toggle)
   ========================================================================= */
function attachBoardDelegation() {
  const board = document.getElementById("board");

  board.addEventListener("change", (e) => {
    if (e.target.dataset.action === "move") {
      moveTask(e.target.dataset.id, e.target.value);
    }
  });

  board.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const { action, id } = btn.dataset;

    if (action === "start-delete") {
      state.deleteConfirmingId = id;
      renderBoard();
    } else if (action === "cancel-delete") {
      state.deleteConfirmingId = null;
      renderBoard();
    } else if (action === "confirm-delete") {
      deleteTask(id);
    }
  });
}

/* =========================================================================
   FILTER BAR
   ========================================================================= */
function attachFilterHandlers() {
  const projectSel = document.getElementById("filterProject");
  const assigneeInput = document.getElementById("filterAssignee");
  const prioritySel = document.getElementById("filterPriority");
  const clearBtn = document.getElementById("clearFiltersBtn");

  projectSel.addEventListener("change", () => {
    state.filters.project = projectSel.value;
    renderBoard();
  });

  assigneeInput.addEventListener("input", () => {
    state.filters.assignee = assigneeInput.value;
    renderBoard();
  });

  prioritySel.addEventListener("change", () => {
    state.filters.priority = prioritySel.value;
    renderBoard();
  });

  clearBtn.addEventListener("click", () => {
    state.filters = { project: "", assignee: "", priority: "" };
    projectSel.value = "";
    assigneeInput.value = "";
    prioritySel.value = "";
    renderBoard();
  });
}

/* =========================================================================
   THEME (light/dark toggle)
   ========================================================================= */
function getStoredTheme() {
  try {
    const stored = localStorage.getItem(THEME_STORAGE_KEY);
    return stored === "light" || stored === "dark" ? stored : null;
  } catch (err) {
    return null;
  }
}

function getPreferredTheme() {
  return (
    getStoredTheme() ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
  );
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("themeToggleBtn");
  if (!btn) return;
  const isDark = theme === "dark";
  btn.textContent = isDark ? "☀" : "🌙";
  btn.setAttribute("aria-pressed", String(isDark));
  btn.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
}

function attachThemeToggle() {
  applyTheme(getPreferredTheme());
  document.getElementById("themeToggleBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try {
      localStorage.setItem(THEME_STORAGE_KEY, next);
    } catch (err) {
      // Private browsing / storage disabled — theme still applies for this page view.
    }
  });
}

/* =========================================================================
   ADD TASK MODAL + FORM VALIDATION
   ========================================================================= */
let lastFocusedBeforeModal = null;

function getFocusableElements(container) {
  return Array.from(
    container.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )
  ).filter((el) => el.offsetParent !== null);
}

function trapModalTab(e) {
  if (e.key !== "Tab") return;
  const modal = document.querySelector("#modalOverlay .modal");
  const focusable = getFocusableElements(modal);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];

  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

function openModal() {
  lastFocusedBeforeModal = document.activeElement;
  const overlay = document.getElementById("modalOverlay");
  overlay.hidden = false;
  document.getElementById("fieldTitle").focus();
}

function closeModal() {
  const overlay = document.getElementById("modalOverlay");
  overlay.hidden = true;
  resetForm();
  if (lastFocusedBeforeModal) {
    lastFocusedBeforeModal.focus();
    lastFocusedBeforeModal = null;
  }
}

function resetForm() {
  const form = document.getElementById("taskForm");
  form.reset();
  ["Title", "Description", "Assignee", "DueDate"].forEach((f) => {
    document.getElementById("err" + f).textContent = "";
  });
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

function validateForm(values) {
  const errors = {};

  if (!values.title.trim()) {
    errors.title = "Task title is required.";
  } else if (values.title.length > 80) {
    errors.title = "Task title must be 80 characters or fewer.";
  }

  if (values.description.length > 500) {
    errors.description = "Description must be 500 characters or fewer.";
  }

  if (!values.assignee.trim()) {
    errors.assignee = "Assignee is required.";
  }

  if (!values.dueDate) {
    errors.dueDate = "Due date is required.";
  } else if (!isValidIsoDate(values.dueDate)) {
    errors.dueDate = "Due date is not a valid date.";
  } else if (values.dueDate < todayIso()) {
    errors.dueDate = "Due date cannot be in the past.";
  }

  return errors;
}

function showFormErrors(errors) {
  document.getElementById("errTitle").textContent = errors.title || "";
  document.getElementById("errDescription").textContent = errors.description || "";
  document.getElementById("errAssignee").textContent = errors.assignee || "";
  document.getElementById("errDueDate").textContent = errors.dueDate || "";
}

function attachModalHandlers() {
  document.getElementById("openAddTaskBtn").addEventListener("click", openModal);
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("cancelAddTaskBtn").addEventListener("click", closeModal);

  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("modalOverlay").hidden) return;
    if (e.key === "Escape") {
      closeModal();
    } else if (e.key === "Tab") {
      trapModalTab(e);
    }
  });

  document.getElementById("taskForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const values = {
      title: form.title.value,
      description: form.description.value,
      project: form.project.value,
      category: form.category.value,
      assignee: form.assignee.value,
      priority: form.priority.value,
      dueDate: form.dueDate.value,
      status: form.status.value,
    };

    const errors = validateForm(values);
    showFormErrors(errors);
    if (Object.keys(errors).length > 0) return;

    const submitBtn = document.getElementById("submitTaskBtn");
    submitBtn.disabled = true;
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = "Sending…";

    try {
      await addTask(values);
      closeModal();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
function init() {
  attachThemeToggle();
  attachAnalyticsToggle();
  seedTasks();
  renderProjectFilterOptions();
  attachFilterHandlers();
  attachModalHandlers();
  attachBoardDelegation();
  renderBoard();
}

document.addEventListener("DOMContentLoaded", init);
</script>
